[project]
name = "skillgen"
version = "0.1.0"
description = "SkillGen — dataset pipelines for training a skill-generator model"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "fastapi>=0.156.2",
    "matplotlib>=3.11.2",
    "peft>=0.21.2",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "trl>=1.16.0",
    "uvicorn>=0.54.0",
]

# Torch: CPU wheel ONLY for local dev on this VM (the default Linux wheel
# pulls multi-GB CUDA dependencies). Kaggle provides its own CUDA torch,
# so this pin only affects local CPU work — see notebooks 02/03.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]

# Install the src-layout package into the venv so the documented CLIs work
# verbatim, e.g. `uv run python -m skillgen.training.train --config ...`
# (pytest alone used to mask this via its pythonpath setting).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillgen"]

[project.optional-dependencies]
# GPU training stack (Kaggle T4). Not needed for data/eval/tests.
# Carried from pre-merge remote main: the ML build restructured deps
# and dropped this group; kept so the Kaggle GPU stack stays declared.
train = [
    "unsloth",
    "trl",
    "transformers",
    "datasets",
    "peft",
    "bitsandbytes",
    "accelerate",
    "pyyaml",
    "wandb",
]
